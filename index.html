<body>
<div id="app"></div>
<script>
(()=>{
const defaults={name:'Nova',height:1.72,head:.98,shoulders:.53,chest:.48,waist:.36,hips:.44,arm:.94,hand:.88,leg:1.02,muscle:.24,posture:50,skin:'#c98764',hair:'#33251f',eye:'#557d8b',brow:'#352822',top:'#637c91',bottom:'#303f5a',shoe:'#252b36',accent:'#db9f79',hairStyle:'Soft waves',eyeStyle:'Almond',noseStyle:'Straight',lipStyle:'Soft',body:'Athletic',walk:'Relaxed',stance:'Natural',expression:'Warm',topStyle:'Fitted tee',bottomStyle:'Tailored pants',shoeStyle:'High-top',material:'Cotton',texture:'Soft matte',jacket:'None',accessory:'Small hoops',earrings:'Gold hoops',necklace:'Fine chain',glasses:'None',pose:'Stand',gesture:'Open palm',animation:'Idle',mood:'Curious',role:'Creative partner',voice:'Warm · measured',pace:50,curiosity:72,confidence:62,empathy:78,playfulness:58,memory:'Loves morning light, old records, and curious conversations.',scenario:'An easygoing studio session. Friendly, collaborative, and always respectful.',command:'',zoom:100,rotate:0};
let avatar={...defaults},activeSection='body',activeTab='shape',running=true,drag=null,toastTimeout;const root=document.querySelector('#app');
const sections=[['body','◉','Body'],['face','◌','Face'],['wardrobe','▧','Wardrobe'],['motion','↝','Motion'],['personality','✧','Personality']];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){root.innerHTML=`<div class="app"><header class="topbar"><div class="logo">FORME<i>.</i></div><div class="topcrumb">Studio <span style="color:#566075">/</span> Characters <span style="color:#566075">/</span> <b>${esc(avatar.name)}</b></div><div class="topright"><div class="status">LIVE PREVIEW</div><button class="btn" id="reset">Reset</button><button class="btn accent" id="save">Save character</button><button class="btn icon" id="more" aria-label="More options">···</button></div></header><main class="workspace"><aside class="sidebar"><div class="side-title">YOUR CHARACTERS</div><div class="character-card"><div class="avatar-thumb">◉</div><div><div class="char-name">${esc(avatar.name)}</div><div class="char-meta">Custom character · edited just now</div></div><div class="edit-badge">●</div></div><button class="newchar" id="newchar">＋ &nbsp;Add character</button><div class="sidebar-label">CUSTOMIZE</div><nav class="section-nav">${sections.map(([key,icon,title])=>`<button class="nav-item ${key===activeSection?'active':''}" data-section="${key}"><span class="ni">${icon}</span>${title}<span class="nav-count">${key==='body'?'12':key==='face'?'9':key==='wardrobe'?'8':key==='motion'?'7':'6'}</span></button>`).join('')}</nav><div class="sidebar-label">CHARACTER PROFILE</div><div class="section-nav"><button class="nav-item" data-section="personality"><span class="ni">◎</span>Personality & AI</button><button class="nav-item" id="export"><span class="ni">⇩</span>Export appearance</button><button class="nav-item" id="import"><span class="ni">⇧</span>Import appearance</button></div><div class="side-foot"><b>✦ &nbsp;Changes are live</b>Every adjustment updates the character in the preview instantly. No restart needed.</div></aside><section class="center"><div class="canvas-head"><div class="canvas-title">CHARACTER PREVIEW <span>· &nbsp;STUDIO LIGHTING</span></div><div class="tiny-actions"><button class="tiny selected" data-view="front">FRONT</button><button class="tiny" data-view="side">SIDE</button><button class="tiny" data-view="back">BACK</button></div></div><div class="stage" id="stage"><div class="ground"></div><div id="avatarCanvas" aria-label="Live 3D character preview"></div></div><div class="stage-hint">Drag to rotate <kbd>↻</kbd> &nbsp;Scroll to zoom <kbd>＋</kbd> <kbd>−</kbd></div><div class="bottom-tools"><div class="pose-tools"><button class="pose-btn active" data-pose="Stand">Stand</button><button class="pose-btn" data-pose="Walk">Walk</button><button class="pose-btn" data-pose="Run">Run</button><button class="pose-btn" data-pose="Sit">Sit</button></div><div class="viewtools"><button class="tiny" id="zoomout">−</button><button class="tiny" id="zoomread">100%</button><button class="tiny" id="zoomin">＋</button></div></div></section><section class="rightpanel"><div class="panel-head"><div><div class="panel-title">Character editor</div><div class="panel-sub">Fine-tune every detail</div></div><div class="live">● LIVE</div></div><div class="mobile-tabs">${sections.map(([k,,t])=>`<button data-section="${k}" class="${k===activeSection?'active':''}">${t}</button>`).join('')}</div><div class="tabs" id="tabs"></div><div class="controls" id="controls"></div></section></main></div><div class="toast" id="toast"></div><div class="modalback" id="modalback"><div class="modal" id="modal"></div></div>`;drawCanvas();renderControls();bindGlobal()}
const tabSets={body:[['shape','Body shape'],['proportions','Proportions'],['skin','Skin'],['posture','Posture']],face:[['features','Features'],['details','Details'],['expression','Expression']],wardrobe:[['clothing','Clothing'],['colors','Colors'],['accessories','Accessories']],motion:[['poses','Poses'],['movement','Movement'],['gestures','Gestures']],personality:[['traits','Traits'],['voice','Voice'],['memory','Memory & AI']]};
function options(values){return values.map(x=>`<option ${x===avatar[arguments[1]]?'selected':''}>${x}</option>`).join('')}
const select=(key,label,values)=>`<div class="row select-row"><label>${label}</label><select data-key="${key}">${values.map(v=>`<option value="${esc(v)}" ${avatar[key]===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div>`;
const range=(key,label,min,max,step=.01,unit='')=>{let v=avatar[key],pct=(v-min)/(max-min)*100;return `<div class="row"><label>${label}</label><input type="range" min="${min}" max="${max}" step="${step}" value="${v}" data-key="${key}" style="--fill:${pct}%"><output>${step<1?Number(v).toFixed(2):Math.round(v)}${unit}</output></div>`};
const colors=(key,label,palette)=>`<div class="group"><div class="grouphead"><div class="groupname">${label}</div><span class="group-extra">CUSTOM COLOR</span></div><div class="color-row">${palette.map(c=>`<button class="swatch ${avatar[key].toLowerCase()===c.toLowerCase()?'active':''}" style="background:${c}" data-color-key="${key}" data-color="${c}" aria-label="${c}"></button>`).join('')}<input class="custom-color" type="color" value="${avatar[key]}" data-key="${key}" aria-label="Choose custom ${label.toLowerCase()} color"></div></div>`;
const group=(title,body,extra='')=>`<div class="group"><div class="grouphead"><div class="groupname">${title}</div><span class="group-extra">${extra}</span></div>${body}</div>`;
function renderControls(){const tabs=tabSets[activeSection]||tabSets.body;if(!tabs.some(t=>t[0]===activeTab))activeTab=tabs[0][0];document.querySelector('#tabs').innerHTML=tabs.map(([key,title])=>`<button class="tab ${key===activeTab?'active':''}" data-tab="${key}">${title}</button>`).join('');let c='';
if(activeSection==='body'){
if(activeTab==='shape')c=group('Overall silhouette',select('body','Body shape',['Athletic','Soft','Lean','Curvy','Broad','Petite','Tall','Custom'])+range('muscle','Muscle definition',0,1,.01)+range('height','Height',1.45,2.1,.01,' m'),'FORM')+group('Body proportions',range('shoulders','Shoulder width',.32,.78)+range('chest','Chest',.3,.75)+range('waist','Waist',.25,.62)+range('hips','Hip width',.3,.7),'5 PARAMETERS')+group('Arms & hands',range('arm','Arm length',.72,1.18)+range('hand','Hand size',.65,1.12),'2 PARAMETERS')+group('Legs & stance',range('leg','Leg length',.75,1.28)+select('stance','Default stance',['Natural','Confident','Relaxed','Formal','Dynamic']),'2 PARAMETERS');
if(activeTab==='proportions')c=group('Proportions',range('head','Head size',.78,1.18)+range('shoulders','Shoulder width',.32,.78)+range('chest','Chest',.3,.75)+range('waist','Waist',.25,.62)+range('hips','Hip width',.3,.7)+range('arm','Arm length',.72,1.18)+range('hand','Hand size',.65,1.12)+range('leg','Leg length',.75,1.28),'8 PARAMETERS')+group('Quick presets',`<div class="chips">${['Balanced','Long-limbed','Compact','Broad frame','Custom'].map(v=>`<button class="chip preset" data-preset="${v}">${v}</button>`).join('')}</div>`);
if(activeTab==='skin')c=group('Complexion',colors('skin','Skin tone',['#f2cdb2','#dfa987','#c98764','#a96d51','#805239','#583d37','#e8b99a','#bf8877'])+select('texture','Skin texture',['Natural','Soft matte','Freckles','Beauty marks','Subtle pores','Smooth'])+range('freckle','Freckle intensity',0,1,.01),'8 TONES')+group('Details',`<div class="chips">${['Freckles','Beauty mark · left','Beauty mark · right','Blush','None'].map((v,i)=>`<button class="chip detail-chip" data-detail="${v}">${v}</button>`).join('')}</div>`);
if(activeTab==='posture')c=group('Posture & gait',range('posture','Posture',0,100,1,'%')+select('walk','Walking style',['Relaxed','Confident','Bouncy','Elegant','Casual','Purposeful'])+select('stance','Standing pose',['Natural','Confident','Relaxed','Formal','Dynamic']),'3 PARAMETERS')+group('Preview animation',`<div class="chips"><button class="chip" data-pose="Stand">Stand</button><button class="chip" data-pose="Walk">Walk</button><button class="chip" data-pose="Run">Run</button><button class="chip" data-pose="Sit">Sit</button></div>`);
